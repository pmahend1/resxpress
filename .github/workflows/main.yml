name: Deploy CI

on:
  workflow_dispatch:
    inputs:
      shouldPublishToVSMarketPlace:
        description: "Publish to Visual Studio MarketPlace?"
        type: boolean
        default: true
      shouldPublishToOpenVsx:
        description: "Publish to Open-VSX?"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack vsix
        id: pack
        run: |
          pnpm exec vsce pack --no-dependencies
          $VsixName = Get-ChildItem -Filter *.vsix | Select-Object -First 1 -ExpandProperty Name
          Write-Host "`$VsixName = $VsixName"
          "VSIX_FILENAME=$VsixName" >> $env:GITHUB_OUTPUT

      - name: VSCE Publish
        if: ${{ inputs.shouldPublishToVSMarketPlace }}
        run: |
          Write-Host "Running pnpm exec vsce publish --packagePath ${{ steps.pack.outputs.VSIX_FILENAME }} --pat `$env:VSCE_PAT"
          pnpm exec vsce publish --packagePath ${{ steps.pack.outputs.VSIX_FILENAME }} --pat $env:VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}

      - name: Open VSX Publish
        if: ${{ inputs.shouldPublishToOpenVsx }}
        run: |
          Write-Host "Running pnpm exec ovsx publish --packagePath ${{ steps.pack.outputs.VSIX_FILENAME }} --pat `$env:OPEN_VSX_PAT"
          pnpm exec ovsx publish --packagePath ${{ steps.pack.outputs.VSIX_FILENAME }} --pat $env:OPEN_VSX_PAT
        env:
          OPEN_VSX_PAT: ${{ secrets.OPENVSX }}
