name: Deploy CI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      shouldPublishToVSMarketPlace:
        description: "Publish to Visual Studio MarketPlace?"
        type: boolean
        default: true
      shouldPublishToOpenVsx:
        description: "Publish to Open-VSX?"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the release trigger and the source of version truth, but vsce packs
      # whatever package.json says. A vsix whose version disagrees with its release tag
      # cannot be unpublished from the Marketplace, so fail before packaging, not after.
      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace "^v", ""
          $packageVersion = (Get-Content .\package.json | ConvertFrom-Json).version
          Write-Host "Tag version         : $tagVersion"
          Write-Host "package.json version: $packageVersion"
          if ($tagVersion -ne $packageVersion) {
            throw [System.Exception]("Tag version $tagVersion does not match package.json version $packageVersion ❌")
          }
          Write-Host "Pass ✅"

      - name: Pack vsix
        id: pack
        run: |
          pnpm exec vsce pack --no-dependencies
          $VsixName = Get-ChildItem -Filter *.vsix | Select-Object -First 1 -ExpandProperty Name
          Write-Host "`$VsixName = $VsixName"
          "VSIX_FILENAME=$VsixName" >> $env:GITHUB_OUTPUT

      # A tag push has no equivalent of the two dispatch toggles, so it publishes to both.
      - name: VSCE Publish
        if: ${{ github.event_name == 'push' || inputs.shouldPublishToVSMarketPlace }}
        run: |
          Write-Host "Running pnpm exec vsce publish --packagePath ${{ steps.pack.outputs.VSIX_FILENAME }} --pat `$env:VSCE_PAT"
          pnpm exec vsce publish --packagePath ${{ steps.pack.outputs.VSIX_FILENAME }} --pat $env:VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}

      - name: Open VSX Publish
        if: ${{ github.event_name == 'push' || inputs.shouldPublishToOpenVsx }}
        run: |
          Write-Host "Running pnpm exec ovsx publish --packagePath ${{ steps.pack.outputs.VSIX_FILENAME }} --pat `$env:OPEN_VSX_PAT"
          pnpm exec ovsx publish --packagePath ${{ steps.pack.outputs.VSIX_FILENAME }} --pat $env:OPEN_VSX_PAT
        env:
          OPEN_VSX_PAT: ${{ secrets.OPENVSX }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
          files: ${{ steps.pack.outputs.VSIX_FILENAME }}
